<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="50" y1="35" x2="50" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D47A1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M 50 14 C 68 18 84 20 84 25 C 84 55 68 76 50 86 C 32 76 16 55 16 25 C 16 20 32 18 50 14 Z" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M 50 17 C 66 21 80 23 80 27 C 80 53 66 72 50 82 C 34 72 20 53 20 27 C 20 23 34 21 50 17 Z" stroke="#42A5F5" stroke-width="1.5" stroke-opacity="0.6" fill="none" />

  <!-- Top-Center Mesh Node -->
  <circle cx="50" cy="14" r="4.5" fill="#00E5FF" stroke="#0D47A1" stroke-width="1.5" />

  <!-- Left-Shoulder Mesh Node -->
  <circle cx="16" cy="25" r="4" fill="#00E5FF" stroke="#0D47A1" stroke-width="1.5" />

  <!-- Right-Shoulder Mesh Node -->
  <circle cx="84" cy="25" r="4" fill="#00E5FF" stroke="#0D47A1" stroke-width="1.5" />

  <!-- Central Water Droplet -->
  <path d="M 50 35 C 50 35 66 52 66 61 C 66 70 58.8 77 50 77 C 41.2 77 34 70 34 61 C 34 52 50 35 50 35 Z" fill="url(#dropGrad)" />

  <!-- Center White Sensor Core -->
  <circle cx="50" cy="62" r="4.5" fill="#FFFFFF" />
</svg>
